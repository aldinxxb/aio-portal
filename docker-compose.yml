services:
  graphdb:
    image: ontotext/graphdb:10.8.0
    ports:
      - "7200:7200"
    volumes:
      - graphdb-data:/opt/graphdb/home

  graphdb-init:
    image: curlimages/curl:latest
    depends_on:
      - graphdb
    volumes:
      - ./ontology:/ontology:ro
      - ./graphdb:/init:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until curl -sf http://graphdb:7200/rest/repositories > /dev/null; do
          echo "waiting for GraphDB..."; sleep 3
        done
        if curl -sf http://graphdb:7200/rest/repositories | grep -q '"aio"'; then
          echo "repository aio already exists, nothing to do"; exit 0
        fi
        curl -sSf -X POST -F config=@/init/aio-config.ttl http://graphdb:7200/rest/repositories
        # AIO 0.9.0: the core and each extension in its own graph (named by the module IRI), so a
        # module can be reloaded alone; the portal's queries read all graphs together
        load() { curl -sSf -X POST -H "Content-Type: application/x-turtle" --data-binary @/ontology/$$1 "http://graphdb:7200/repositories/aio/rdf-graphs/service?graph=$$2"; }
        load aio-core.ttl                 https%3A%2F%2Fw3id.org%2Faio
        load aio-additions.ttl            https%3A%2F%2Fw3id.org%2Faio
        load aio-deprecated.ttl           https%3A%2F%2Fw3id.org%2Faio
        load aio-requirements.ttl         https%3A%2F%2Fw3id.org%2Faio%2Frequirements
        load aio-workflow.ttl             https%3A%2F%2Fw3id.org%2Faio%2Fworkflow
        load aio-software.ttl             https%3A%2F%2Fw3id.org%2Faio%2Fsoftware
        load aio-software-generated.ttl   https%3A%2F%2Fw3id.org%2Faio%2Fsoftware
        load aio-alignments.ttl           https%3A%2F%2Fw3id.org%2Faio%2Falignments
        echo "ontology loaded"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      GRAPHDB_URL: http://graphdb:7200
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      graphdb-init:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  graphdb-data: